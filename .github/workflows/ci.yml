name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    name: Lint & Database Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bot
          POSTGRES_PASSWORD: bot_password
          POSTGRES_DB: ytbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install System Dependencies (ffmpeg & yt-dlp)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg python3-pip
          pip3 install --break-system-packages yt-dlp

      - name: Install Node Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier Format Check
        run: npm run format:check

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Initialize PostgreSQL Schema
        env:
          DATABASE_URL: postgresql://bot:bot_password@localhost:5432/ytbot?schema=public
        run: npx prisma db push --skip-generate

      - name: Run Full Test Suite
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://bot:bot_password@localhost:5432/ytbot?schema=public
          BOT_TOKEN: 123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11
          ALLOWED_USER_IDS: 123456789,987654321
        run: npm test -- --runInBand

  build-docker:
    name: Build Docker Image
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: docker build -t youtube-downloader-bot:latest .
